<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ef">
  <link rel="icon" href="data:,">
  <title>设备互联</title>
  <style>
    :root{color-scheme:light;--ink:#252422;--muted:#797671;--line:#dedbd4;--paper:#f5f3ef;--card:#fff;--accent:#7259e8;--accent-2:#4c87f5;--danger:#c44848}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}button,input,textarea{font:inherit}button{cursor:pointer}.screen{min-height:100dvh}.pair{display:grid;place-items:center;padding:28px 20px}.pair-card{width:min(100%,420px);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 24px 64px #463f3218}.mark{display:grid;place-items:center;width:58px;height:58px;border-radius:18px;color:white;font-size:26px;background:linear-gradient(145deg,var(--accent),var(--accent-2));box-shadow:0 12px 28px #7259e83d}.pair h1{margin:22px 0 6px;font-size:28px;letter-spacing:-.04em}.pair p{margin:0 0 24px;color:var(--muted)}label{display:block;margin:16px 0 7px;font-size:13px;font-weight:650}.field{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:#fbfaf8;padding:0 14px;color:var(--ink);outline:none}.field:focus,.composer textarea:focus{border-color:#917cef;box-shadow:0 0 0 3px #7259e815}.code{font-size:22px;letter-spacing:.28em;text-align:center;font-variant-numeric:tabular-nums}.primary{width:100%;height:50px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:white;font-weight:700;margin-top:20px;box-shadow:0 10px 25px #7259e82d}.primary:disabled{opacity:.55}.error{min-height:21px;margin-top:12px;color:var(--danger);font-size:13px}.hint{margin-top:18px!important;font-size:12px}.app{display:none;grid-template-rows:auto 1fr auto;height:100dvh;max-width:760px;margin:auto;background:#faf9f7;border-inline:1px solid var(--line)}.topbar{display:flex;align-items:center;gap:12px;padding:max(13px,env(safe-area-inset-top)) 16px 13px;background:#ffffffd9;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;color:white;background:linear-gradient(145deg,var(--accent),var(--accent-2));font-weight:750}.topbar strong{display:block}.status{font-size:12px;color:var(--muted)}.status.online{color:#348a56}.messages{overflow:auto;padding:24px 16px 40px}.empty{text-align:center;color:var(--muted);padding:64px 20px}.day{text-align:center;color:var(--muted);font-size:12px;margin:20px}.row{display:flex;margin:9px 0}.row.outgoing{justify-content:flex-end}.bubble{max-width:min(82%,560px);border:1px solid var(--line);border-radius:18px 18px 18px 5px;padding:11px 13px;background:white;box-shadow:0 3px 12px #332e2410}.outgoing .bubble{border:0;border-radius:18px 18px 5px 18px;background:#e9e3ff}.sender{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.text a{color:#315fbd}.meta{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:7px;font-size:10px;color:var(--muted)}.mini{border:0;padding:2px 0;color:var(--accent);background:transparent;font-size:11px}.file{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;min-width:240px}.file-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#f0edf9;font-size:20px}.file-name{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-size{font-size:11px;color:var(--muted)}.download{border:0;border-radius:10px;padding:7px 9px;color:var(--accent);background:#f1edff}.composer{padding:10px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#ffffffeb;backdrop-filter:blur(18px)}.compose-box{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:end}.attach,.send{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:14px}.attach{background:#eeece7;color:#5e5a54}.send{background:var(--accent);color:white}.composer textarea{resize:none;max-height:120px;min-height:42px;border:1px solid var(--line);border-radius:15px;background:#f8f7f4;padding:10px 12px;outline:none}.progress{display:none;height:3px;margin:0 5px 7px;border-radius:4px;background:#e7e3dc;overflow:hidden}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .15s}.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);padding:9px 13px;border-radius:12px;background:#262421;color:white;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--ink:#f1eee9;--muted:#aaa59d;--line:#3a3733;--paper:#1c1a18;--card:#272421}.field,.composer textarea{background:#211f1c}.app{background:#201e1b}.topbar,.composer{background:#272421e8}.bubble{background:#2a2723}.outgoing .bubble{background:#443776}.file-icon{background:#37313f}.attach{background:#3a3631}.download{background:#3a3153}}
  </style>
</head>
<body>
  <main id="pairScreen" class="screen pair">
    <section class="pair-card">
      <div class="mark">↗</div>
      <h1>连接到 <span id="serverName">电脑</span></h1>
      <p>输入电脑端显示的匹配码，建立加密会话。</p>
      <label for="deviceName">这台设备的名称</label>
      <input id="deviceName" class="field" maxlength="60">
      <label for="pairCode">匹配码</label>
      <input id="pairCode" class="field code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="••••••">
      <button id="pairButton" class="primary">安全连接</button>
      <div id="pairError" class="error" role="alert"></div>
      <p class="hint">二维码中的一次性密钥与匹配码共同验证身份；匹配码不会直接上传。</p>
    </section>
  </main>

  <main id="chatApp" class="app">
    <header class="topbar"><div class="avatar">DL</div><div><strong id="chatTitle">设备互联</strong><span id="status" class="status">正在连接…</span></div></header>
    <section id="messages" class="messages"><div class="empty">还没有消息<br>从任意设备发送文字、图片或文件</div></section>
    <footer class="composer">
      <div id="progress" class="progress"><i></i></div>
      <div class="compose-box">
        <button id="attachButton" class="attach" aria-label="选择文件">＋</button>
        <textarea id="composer" rows="1" maxlength="200000" placeholder="发送文字或链接…"></textarea>
        <button id="sendButton" class="send" aria-label="发送">↑</button>
      </div>
      <input id="fileInput" type="file" multiple hidden>
    </footer>
  </main>
  <div id="toast" class="toast"></div>

  <script src="/crypto-fallback.js"></script>
  <script>
    (() => {
      const enc = new TextEncoder(), dec = new TextDecoder();
      const pairScreen = document.querySelector('#pairScreen'), chatApp = document.querySelector('#chatApp');
      const messagesEl = document.querySelector('#messages'), pairError = document.querySelector('#pairError');
      const progress = document.querySelector('#progress'), progressBar = progress.querySelector('i');
      const deviceId = localStorage.deviceLinkDeviceId || (localStorage.deviceLinkDeviceId = randomDeviceId());
      const defaultName = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'iPhone / iPad' : /Android/i.test(navigator.userAgent) ? 'Android 手机' : '浏览器设备';
      document.querySelector('#deviceName').value = localStorage.deviceLinkDeviceName || defaultName;
      let pairing, token, key, socket, ownDeviceId = deviceId, messageMap = new Map();

      function randomDeviceId(){const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=[...bytes].map(value=>value.toString(16).padStart(2,'0')).join('');return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`}
      function bytesToB64(bytes){let s='';new Uint8Array(bytes).forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
      function b64ToBytes(value){const b=value.replace(/-/g,'+').replace(/_/g,'/');const raw=atob(b+'='.repeat((4-b.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
      function hasWebCrypto(){return Boolean(crypto.subtle)}
      async function deriveKey(secret, code, salt, iterations){if(!hasWebCrypto())return deviceLinkCryptoFallback.pbkdf2Sha256(enc.encode(`${secret}:${code}`),b64ToBytes(salt),iterations);const material=await crypto.subtle.importKey('raw',enc.encode(`${secret}:${code}`),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64ToBytes(salt),iterations},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
      async function hmacProof(secret, code, state){if(!hasWebCrypto()){const bits=await deriveKey(secret,code,state.salt,state.iterations);return bytesToB64(deviceLinkCryptoFallback.hmacSha256(bits,enc.encode(`device-link-pair-v1:${state.sessionId}:${state.challenge}`)))}const material=await crypto.subtle.importKey('raw',enc.encode(`${secret}:${code}`),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64ToBytes(state.salt),iterations:state.iterations},material,256);const hkey=await crypto.subtle.importKey('raw',bits,{name:'HMAC',hash:'SHA-256'},false,['sign']);return bytesToB64(await crypto.subtle.sign('HMAC',hkey,enc.encode(`device-link-pair-v1:${state.sessionId}:${state.challenge}`)))}
      async function importSessionKey(value){const bytes=b64ToBytes(value);return hasWebCrypto()?crypto.subtle.importKey('raw',bytes,{name:'AES-GCM'},false,['encrypt','decrypt']):bytes}
      function nodeEnvelope(iv,webCryptoBody){const body=new Uint8Array(webCryptoBody),tag=body.slice(body.length-16),ciphertext=body.slice(0,-16),out=new Uint8Array(28+ciphertext.length);out.set(iv);out.set(tag,12);out.set(ciphertext,28);return out}
      function webCryptoEnvelope(nodeBytes){const bytes=new Uint8Array(nodeBytes),ciphertext=bytes.slice(28),tag=bytes.slice(12,28),body=new Uint8Array(ciphertext.length+16);body.set(ciphertext);body.set(tag,ciphertext.length);return {iv:bytes.slice(0,12),body}}
      async function encryptRaw(bytes,aad,usingKey=key){const iv=crypto.getRandomValues(new Uint8Array(12));if(hasWebCrypto()){const body=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:enc.encode(aad)},usingKey,bytes);return nodeEnvelope(iv,body)}return nodeEnvelope(iv,deviceLinkCryptoFallback.encrypt(usingKey,iv,new Uint8Array(bytes),enc.encode(aad)))}
      async function decryptRaw(bytes,aad,usingKey=key){const envelope=webCryptoEnvelope(bytes);if(hasWebCrypto())return crypto.subtle.decrypt({name:'AES-GCM',iv:envelope.iv,additionalData:enc.encode(aad)},usingKey,envelope.body);return deviceLinkCryptoFallback.decrypt(usingKey,envelope.iv,envelope.body,enc.encode(aad))}
      async function encryptJson(value,aad){return bytesToB64(await encryptRaw(enc.encode(JSON.stringify(value)),aad))}
      async function decryptJson(value,aad,usingKey=key){return JSON.parse(dec.decode(await decryptRaw(b64ToBytes(value),aad,usingKey)))}
      async function encryptChunk(bytes,aad){return encryptRaw(bytes,aad)}
      async function decryptChunk(bytes,aad){return decryptRaw(bytes,aad)}
      function authHeaders(extra={}){return {...extra,Authorization:`Bearer ${token}`}}
      function showToast(text){const el=document.querySelector('#toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
      async function copyText(value){if(navigator.clipboard){await navigator.clipboard.writeText(value);return}const area=document.createElement('textarea');area.value=value;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();const copied=document.execCommand('copy');area.remove();if(!copied)throw new Error('浏览器不允许复制，请长按文字手动复制')}
      function formatSize(size){if(size<1024)return `${size} B`;if(size<1048576)return `${(size/1024).toFixed(1)} KB`;if(size<1073741824)return `${(size/1048576).toFixed(1)} MB`;return `${(size/1073741824).toFixed(1)} GB`}
      function messageTime(value){return new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit'}).format(new Date(value))}
      function setMessages(items){for(const item of items)messageMap.set(item.id,item);renderMessages()}
      function renderMessages(){messagesEl.replaceChildren();if(!messageMap.size){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='还没有消息<br>从任意设备发送文字、图片或文件';messagesEl.append(empty);return}for(const message of [...messageMap.values()].sort((a,b)=>a.createdAt.localeCompare(b.createdAt))){const row=document.createElement('article');row.className=`row ${message.senderId===ownDeviceId?'outgoing':'incoming'}`;const bubble=document.createElement('div');bubble.className='bubble';if(message.senderId!==ownDeviceId){const sender=document.createElement('div');sender.className='sender';sender.textContent=message.senderName;bubble.append(sender)}if(message.text){const text=document.createElement('div');text.className='text';if(message.kind==='link'&&/^https?:\/\//.test(message.text)){const link=document.createElement('a');link.href=message.text;link.target='_blank';link.rel='noopener noreferrer';link.textContent=message.text;text.append(link)}else text.textContent=message.text;bubble.append(text)}for(const attachment of message.attachments||[]){const file=document.createElement('div');file.className='file';const icon=document.createElement('div');icon.className='file-icon';icon.textContent=attachment.mime.startsWith('image/')?'▧':'◇';const info=document.createElement('div');const name=document.createElement('div');name.className='file-name';name.textContent=attachment.name;const size=document.createElement('div');size.className='file-size';size.textContent=formatSize(attachment.size);info.append(name,size);const download=document.createElement('button');download.className='download';download.textContent='下载';download.onclick=()=>downloadAttachment(attachment);file.append(icon,info,download);bubble.append(file)}const meta=document.createElement('div');meta.className='meta';const time=document.createElement('span');time.textContent=messageTime(message.createdAt);meta.append(time);if(message.text){const copy=document.createElement('button');copy.className='mini';copy.textContent='复制';copy.onclick=async()=>{try{await copyText(message.text);showToast('已复制')}catch(error){showToast(error.message)}};meta.append(copy)}bubble.append(meta);row.append(bubble);messagesEl.append(row)}messagesEl.scrollTop=messagesEl.scrollHeight}
      async function fetchJson(url,options={}){const response=await fetch(url,options);const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||`请求失败（${response.status}）`);return body}
      async function fetchWithRetry(url,options={}){let lastError;for(let attempt=0;attempt<3;attempt++){try{const response=await fetch(url,options);if(response.ok||response.status<500)return response;response.body?.cancel()}catch(error){lastError=error}if(attempt<2)await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)))}throw lastError||new Error('网络暂时不可用，请重试')}
      let downloadDbPromise;function downloadDb(){if(!globalThis.indexedDB)throw new Error('当前浏览器不支持超大文件磁盘暂存');return downloadDbPromise||(downloadDbPromise=new Promise((resolve,reject)=>{const request=indexedDB.open('device-link-downloads',1);request.onupgradeneeded=()=>{const store=request.result.createObjectStore('chunks',{keyPath:'key'});store.createIndex('downloadId','downloadId')};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)}))}
      async function stageDownloadChunk(downloadId,index,bytes){const db=await downloadDb();await new Promise((resolve,reject)=>{const transaction=db.transaction('chunks','readwrite');transaction.objectStore('chunks').put({key:[downloadId,index],downloadId,index,createdAt:Date.now(),blob:new Blob([bytes])});transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error);transaction.onabort=()=>reject(transaction.error)})}
      async function stagedDownloadChunks(downloadId){const db=await downloadDb();return new Promise((resolve,reject)=>{const request=db.transaction('chunks').objectStore('chunks').index('downloadId').getAll(downloadId);request.onsuccess=()=>resolve(request.result.sort((a,b)=>a.index-b.index).map(item=>item.blob));request.onerror=()=>reject(request.error)})}
      async function clearStagedDownload(downloadId){const db=await downloadDb();await new Promise((resolve,reject)=>{const transaction=db.transaction('chunks','readwrite'),request=transaction.objectStore('chunks').index('downloadId').openKeyCursor(IDBKeyRange.only(downloadId));request.onsuccess=()=>{const cursor=request.result;if(cursor){transaction.objectStore('chunks').delete(cursor.primaryKey);cursor.continue()}};transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error)})}
      async function clearOldStagedDownloads(){if(!globalThis.indexedDB)return;const db=await downloadDb(),cutoff=Date.now()-24*60*60*1000;await new Promise((resolve,reject)=>{const transaction=db.transaction('chunks','readwrite'),request=transaction.objectStore('chunks').openCursor();request.onsuccess=()=>{const cursor=request.result;if(cursor){if(cursor.value.createdAt<cutoff)cursor.delete();cursor.continue()}};transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error)})}
      async function pair(){pairError.textContent='';const button=document.querySelector('#pairButton');button.disabled=true;try{const secret=new URLSearchParams(location.hash.slice(1)).get('pair');if(!secret)throw new Error('二维码缺少一次性连接密钥，请重新扫描');const code=document.querySelector('#pairCode').value.trim();if(!/^\d{6,12}$/.test(code))throw new Error('请输入 6–12 位数字匹配码');const name=document.querySelector('#deviceName').value.trim()||defaultName;const proof=await hmacProof(secret,code,pairing);const pairKey=await deriveKey(secret,code,pairing.salt,pairing.iterations);const result=await fetchJson('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:pairing.sessionId,proof,deviceName:name,deviceId,platform:navigator.platform||'browser'})});const pkg=await decryptJson(result.package,`pair:${pairing.sessionId}`,pairKey);token=pkg.token;key=await importSessionKey(pkg.sessionKey);ownDeviceId=pkg.deviceId;localStorage.deviceLinkDeviceName=name;sessionStorage.deviceLinkSession=JSON.stringify({token,sessionKey:pkg.sessionKey,deviceId:pkg.deviceId,expiresAt:pkg.expiresAt});openChat()}catch(error){pairError.textContent=error.message}finally{button.disabled=false}}
      async function restore(){try{const saved=JSON.parse(sessionStorage.deviceLinkSession||'null');if(!saved||new Date(saved.expiresAt)<=new Date())return false;token=saved.token;key=await importSessionKey(saved.sessionKey);ownDeviceId=saved.deviceId;return true}catch{return false}}
      async function openChat(){pairScreen.style.display='none';chatApp.style.display='grid';document.querySelector('#chatTitle').textContent=pairing.deviceName||'设备互联';await loadMessages();connectSocket()}
      async function loadMessages(){const result=await fetchJson('/api/messages',{headers:authHeaders()});setMessages(await decryptJson(result.data,`messages:${ownDeviceId}`))}
      function connectSocket(){const protocol=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(`${protocol}//${location.host}/ws?token=${encodeURIComponent(token)}`);const status=document.querySelector('#status');socket.onopen=()=>{status.textContent='安全连接已建立';status.className='status online'};socket.onclose=event=>{status.className='status';if(event.code===4001||event.code===4003){sessionStorage.removeItem('deviceLinkSession');status.textContent='授权已失效，请重新扫码';showToast('设备授权已失效');return}status.textContent='连接已断开，正在重试…';setTimeout(connectSocket,1800)};socket.onmessage=async event=>{try{const outer=JSON.parse(event.data),message=await decryptJson(outer.data,`ws:${ownDeviceId}`);if(message.type==='messages:sync')setMessages(message.data);if(message.type==='message:new')setMessages([message.data])}catch{socket.close(4003,'Invalid encrypted message')}}}
      async function sendText(){const composer=document.querySelector('#composer'),text=composer.value.trim();if(!text||socket?.readyState!==1)return;socket.send(JSON.stringify({data:await encryptJson({type:'send:text',data:{text}},`ws:${ownDeviceId}`)}));composer.value=''}
      async function uploadFile(file){progress.style.display='block';try{const created=await fetchJson('/api/transfers',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({data:await encryptJson({name:file.name,size:file.size,mime:file.type||'application/octet-stream'},`transfer:new:${ownDeviceId}`)})});const transfer=await decryptJson(created.data,`transfer:created:${ownDeviceId}`);let index=0,offset=0;while(offset<file.size){const plain=await file.slice(offset,offset+transfer.chunkSize).arrayBuffer();const encrypted=await encryptChunk(plain,`transfer:${transfer.id}:${index}`);const response=await fetchWithRetry(`/api/transfers/${transfer.id}/${index}`,{method:'PUT',headers:authHeaders({'Content-Type':'application/octet-stream'}),body:encrypted});const result=await response.json().catch(()=>({}));if(!response.ok&&!(response.status===409&&result.nextIndex===index+1))throw new Error(result.error||'文件分块发送失败');offset+=plain.byteLength;index++;progressBar.style.width=`${Math.round(offset/file.size*100)}%`}await fetchJson(`/api/transfers/${transfer.id}/complete`,{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:'{}'});showToast(`${file.name} 已发送`)}finally{setTimeout(()=>{progress.style.display='none';progressBar.style.width='0'},500)}}
      async function downloadAttachment(attachment){progress.style.display='block';let writable=null,downloadId='';try{if(typeof window.showSaveFilePicker==='function'){const handle=await window.showSaveFilePicker({suggestedName:attachment.name});writable=await handle.createWritable()}const metaResult=await fetchJson(`/api/attachments/${attachment.id}/meta`,{headers:authHeaders()});const meta=await decryptJson(metaResult.data,`attachment:meta:${ownDeviceId}`),stageOnDisk=!writable&&meta.size>128*1024*1024;if(stageOnDisk){if(!globalThis.indexedDB)throw new Error('当前浏览器无法安全暂存超大文件');const estimate=await navigator.storage?.estimate?.();if(estimate?.quota&&(estimate.usage||0)+meta.size>estimate.quota*.9)throw new Error('浏览器可用存储空间不足，无法暂存该文件');downloadId=`${attachment.id}:${Date.now()}`}const chunks=[];for(let index=0;index<meta.chunks;index++){const response=await fetchWithRetry(`/api/attachments/${attachment.id}/chunks/${index}`,{headers:authHeaders()});if(!response.ok){const body=await response.json().catch(()=>({}));throw new Error(body.error||'下载失败')}const plain=await decryptChunk(await response.arrayBuffer(),`attachment:${attachment.id}:${index}`);if(writable)await writable.write(new Uint8Array(plain));else if(stageOnDisk)await stageDownloadChunk(downloadId,index,plain);else chunks.push(plain);progressBar.style.width=`${Math.round((index+1)/Math.max(meta.chunks,1)*100)}%`}if(writable){await writable.close();writable=null}else{const parts=stageOnDisk?await stagedDownloadChunks(downloadId):chunks,blob=new Blob(parts,{type:meta.mime}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=meta.name;link.click();setTimeout(()=>{URL.revokeObjectURL(url);if(downloadId)clearStagedDownload(downloadId).catch(()=>{})},60000)}}catch(error){if(writable)try{await writable.abort()}catch{};if(downloadId)await clearStagedDownload(downloadId).catch(()=>{});if(error.name!=='AbortError')showToast(error.message)}finally{setTimeout(()=>{progress.style.display='none';progressBar.style.width='0'},500)}}
      async function init(){clearOldStagedDownloads().catch(()=>{});try{pairing=await fetchJson('/api/pairing');document.querySelector('#serverName').textContent=pairing.deviceName;if(await restore())await openChat()}catch(error){pairError.textContent=error.message}}
      document.querySelector('#pairButton').onclick=pair;document.querySelector('#sendButton').onclick=sendText;document.querySelector('#composer').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}};document.querySelector('#attachButton').onclick=()=>document.querySelector('#fileInput').click();document.querySelector('#fileInput').onchange=async e=>{for(const file of e.target.files||[])try{await uploadFile(file)}catch(error){showToast(error.message)}e.target.value=''};init();
    })();
  </script>
</body>
